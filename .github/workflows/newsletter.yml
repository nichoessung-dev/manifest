name: Newsletter
# Email v2 (26 Nov 2026): weekly picks and saved-find alerts are sent by .github/workflows/email.yml (scripts/mailer.py)
# now. This workflow has no timer any more and is kept for manual runs of the old engine (scripts/newsletter.py); a run
# with dry_run off still sends the old newsletter to every opted-in member.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'newsletter, saved or sync'
        default: 'newsletter'
      dry_run:
        description: 'Print who would get it and the day''s email budget, send nothing'
        type: boolean
        default: false
jobs:
  send:
    runs-on: ubuntu-latest
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      PLUNK_API_KEY: ${{ secrets.PLUNK_API_KEY }}     # set: every email goes through Plunk (scripts/newsletter.py send_email)
      PLUNK_FROM: ${{ secrets.PLUNK_FROM }}
      PLUNK_FROM_NAME: ${{ secrets.PLUNK_FROM_NAME }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow   # makes the email product pictures (scripts/newsletter.py email_img)
      - name: Sync contacts to Brevo
        run: python scripts/newsletter.py sync    # does nothing once PLUNK_API_KEY is set: the member list lives in Supabase
        continue-on-error: true
      - name: Send
        run: python scripts/newsletter.py ${{ github.event.inputs.mode || (github.event.schedule == '0 16 * * 0' && 'saved') || 'newsletter' }}
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
