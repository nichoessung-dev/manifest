name: Swaps
# Every 15 minutes: the partner link swaps approved on /partner (Supabase approved_swaps()) go into data/link_swaps.json and
# functions/_lib/link_swaps.js, so product pages and their Buy buttons use the partner's item. Commits only when they changed.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: swaps
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/bake_swaps.py
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Commit if changed
        run: |
          git add data/link_swaps.json functions/_lib/link_swaps.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh partner link swaps"
            git pull --rebase
            git push
          fi
