name: Welcome emails
# Email v2 (26 Nov 2026): the welcome emails are sent by .github/workflows/email.yml (scripts/mailer.py) now. This
# workflow has no timer any more and is kept for the old test sends (test_email). A manual run WITHOUT test_email would
# still send the old welcome, ordering and MyCNBox emails (scripts/newsletter.py): do not start one.
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: 'If set, send a one-off TEST email to this address (skips the normal flow).'
        required: false
        default: ''
      test_type:
        description: 'Which test email: welcome, ordering or mycnbox'
        required: false
        default: 'mycnbox'
      test_agent:
        description: 'For test_type ordering: the agent version (empty = no agent picked, mycnbox, kakobuy, lovegobuy, oopbuy, sugargoo, or all = one of each)'
        required: false
        default: ''
# One run at a time: two overlapping runs could both read a new member as not yet welcomed and send twice.
concurrency:
  group: welcome-emails
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: deps
        run: pip install pillow   # the email product pictures (scripts/newsletter.py email_img) of the Recommended finds in every email

      # --- one-off test send (manual dispatch with test_email) ---
      - name: Test email
        if: ${{ github.event.inputs.test_email != '' }}
        run: python scripts/newsletter.py "${{ github.event.inputs.test_type }}-test"
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          PLUNK_API_KEY: ${{ secrets.PLUNK_API_KEY }}
          PLUNK_FROM: ${{ secrets.PLUNK_FROM }}
          PLUNK_FROM_NAME: ${{ secrets.PLUNK_FROM_NAME }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
          TEST_AGENT: ${{ github.event.inputs.test_agent }}

      # --- normal scheduled sequence ---
      # A step exits 1 when more than half of its sends failed (the run turns red). The later steps still run after a
      # failed one, as they did when every step exited 0; they are skipped only when the setup above failed, as before.
      - name: Welcome new signups
        if: ${{ github.event.inputs.test_email == '' }}
        run: python scripts/newsletter.py welcome
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          PLUNK_API_KEY: ${{ secrets.PLUNK_API_KEY }}
          PLUNK_FROM: ${{ secrets.PLUNK_FROM }}
          PLUNK_FROM_NAME: ${{ secrets.PLUNK_FROM_NAME }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
      - name: Wait ~1 minute
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && github.event.inputs.test_email == '' }}
        run: sleep 70
      - name: Ordering guide (1 min after welcome)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && github.event.inputs.test_email == '' }}
        run: python scripts/newsletter.py ordering
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          PLUNK_API_KEY: ${{ secrets.PLUNK_API_KEY }}
          PLUNK_FROM: ${{ secrets.PLUNK_FROM }}
          PLUNK_FROM_NAME: ${{ secrets.PLUNK_FROM_NAME }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          GUIDE_DELAY_MINUTES: '1'
      - name: MyCNBox account nudge (1 day after signup)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && github.event.inputs.test_email == '' }}
        run: python scripts/newsletter.py mycnbox
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          PLUNK_API_KEY: ${{ secrets.PLUNK_API_KEY }}
          PLUNK_FROM: ${{ secrets.PLUNK_FROM }}
          PLUNK_FROM_NAME: ${{ secrets.PLUNK_FROM_NAME }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          AGENT_DELAY_MINUTES: '1440'
