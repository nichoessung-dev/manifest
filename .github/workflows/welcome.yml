name: Welcome emails
on:
  schedule:
    - cron: '17 */4 * * *'   # every 4h: welcome -> (1 min) ordering guide -> (1 day) MyCNBox account nudge
  workflow_dispatch:
    inputs:
      test_email:
        description: 'If set, send a one-off TEST email to this address (skips the normal flow).'
        required: false
        default: ''
      test_type:
        description: 'Which test email: mycnbox or ordering'
        required: false
        default: 'mycnbox'
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- one-off test send (manual dispatch with test_email) ---
      - name: Test email
        if: ${{ github.event.inputs.test_email != '' }}
        run: python scripts/newsletter.py "${{ github.event.inputs.test_type }}-test"
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}

      # --- normal scheduled sequence ---
      - name: Welcome new signups
        if: ${{ github.event.inputs.test_email == '' }}
        run: python scripts/newsletter.py welcome
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
      - name: Wait ~1 minute
        if: ${{ github.event.inputs.test_email == '' }}
        run: sleep 70
      - name: Ordering guide (1 min after welcome)
        if: ${{ github.event.inputs.test_email == '' }}
        run: python scripts/newsletter.py ordering
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          GUIDE_DELAY_MINUTES: '1'
      - name: MyCNBox account nudge (1 day after signup)
        if: ${{ github.event.inputs.test_email == '' }}
        run: python scripts/newsletter.py mycnbox
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          AGENT_DELAY_MINUTES: '1440'
