name: Telegram drops
on:
  schedule:
    - cron: '30 15 * * *'   # 15:30 UTC daily (30 min after Discord drops)
  workflow_dispatch: {}
permissions:
  contents: write            # to commit telegram_posted.json back
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/telegram_drops.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_PER_RUN: '10'
      - name: Save posted state
        run: |
          if [ -n "$(git status --porcelain telegram_posted.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add telegram_posted.json
            git commit -m "chore: update telegram_posted.json [skip ci]"
            git push
          else
            echo "no state change"
          fi
