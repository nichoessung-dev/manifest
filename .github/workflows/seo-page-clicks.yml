name: SEO page clicks
# Buy clicks per page by visit source, and Google product page views per find, for SEO decisions
# (scripts/seo_page_clicks.py, SUPABASE_SERVICE_KEY secret). Aggregates only. Run by hand.
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: seo-page-clicks
  cancel-in-progress: false
jobs:
  clicks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/seo_page_clicks.py
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Commit
        run: |
          git add data/seo_page_clicks.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: buy clicks per page by visit source (seo_page_clicks.json) [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 7)); done
          exit 1
