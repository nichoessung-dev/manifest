name: Finds carousel
# Keeps the next three days of finds posts (slideshow videos) queued in Postiz, which publishes them on time (16:23 and 20:23 Norwegian time).
# GitHub's own scheduler is unreliable, so this only has to wake up now and then to top up the queue and send new TikTok links to Discord.
# To pause: set the repo variable FINDS_LIVE to "false" (and remove queued posts in Postiz).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: shorts
jobs:
  finds:
    runs-on: ubuntu-latest
    if: vars.FINDS_LIVE != 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow imageio-ffmpeg yt-dlp
      - name: Top up the queue and send new links
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          MYCNBOX_WEBHOOK: ${{ secrets.MYCNBOX_WEBHOOK }}
          SHORTS_CHANNELS: ${{ vars.FINDS_CHANNELS || 'tiktok,instagram-standalone,threads,youtube' }}
          FINDS_FOLDER: 10IZ-ip4UjlEy5UMyhXaznvjsfSYZeH6L
          FINDS_MODE: ${{ vars.FINDS_MODE || 'video' }}
          TIKTOK_BRANDED: ${{ vars.TIKTOK_BRANDED }}
        run: python scripts/finds_plan.py
      # The second TikTok account (puroclassico.com/repaddict) gets photo slideshows only, three a day, from its own share of the
      # photos (never a photo the first account has used). To pause it: set the repo variable SLIDES_LIVE to "false".
      - name: Slideshows for the second TikTok account
        if: vars.SLIDES_LIVE != 'false'
        continue-on-error: true
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          SHORTS_CHANNELS: tiktok
          TIKTOK_ACCOUNT: puroclassico.com/repaddict
          FINDS_FOLDER: 10IZ-ip4UjlEy5UMyhXaznvjsfSYZeH6L
          FINDS_MODE: carousel
          FINDS_SLOTS: '11:07,14:37,21:37'
          FINDS_DAYS: '2'
          FINDS_SLIDES: '9'
          FINDS_SINGLE: '1'
          FINDS_OWN: '2'
          FINDS_STATE: slides_used.json
          FINDS_AVOID: finds_used.json,scripts/slides_exclude.json
          FINDS_TEXT: scripts/slides_text.json
          FINDS_LINKS: '0'
          TIKTOK_BRANDED: ${{ vars.TIKTOK_BRANDED }}
        run: python scripts/finds_plan.py
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finds_used.json discord_sent.json 2>/dev/null || true
          git add slides_used.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: finds state [skip ci]"
          # someone else may push at the same moment (a site upload, the stats job): try again a few times before giving up
          for n in 1 2 3 4 5; do
            if git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((n * 6))
          done
          echo "::error::the finds state could not be saved: the next run may reuse photos"; exit 1
