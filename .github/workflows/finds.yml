name: Finds carousel
# Builds a photo carousel from the QC photo folder on Drive (two different items per slide) and posts it via Postiz.
# Scheduled runs post unless the repo variable FINDS_LIVE is set to "false". Manual runs render a preview unless "post" is ticked.
on:
  schedule:
    - cron: '23 14 * * *'   # 14:23 UTC (off the hour: GitHub delays or drops jobs scheduled on the hour)
    - cron: '23 18 * * *'   # 18:23 UTC
  workflow_dispatch:
    inputs:
      channels:
        description: 'Only these channels, comma separated (blank = all)'
        type: string
        default: ''
      post:
        description: 'Post it for real (otherwise: preview only)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency: shorts
jobs:
  finds:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.FINDS_LIVE != 'false'   # on by default; set the variable FINDS_LIVE to false to pause
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow imageio-ffmpeg yt-dlp
      - name: Build
        run: python scripts/make_finds.py --folder 10IZ-ip4UjlEy5UMyhXaznvjsfSYZeH6L --slides 7 --commit-state --out out
      - name: Publish preview (test runs only, to the "previews-finds" branch)
        if: github.event_name == 'workflow_dispatch' && !inputs.post
        run: |
          mkdir -p /tmp/prev && cp out/* /tmp/prev/
          cd /tmp/prev && git init -q -b previews-finds
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "preview"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews-finds
      - name: Post
        if: github.event_name == 'schedule' || inputs.post
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          MYCNBOX_WEBHOOK: ${{ secrets.MYCNBOX_WEBHOOK }}
          SHORTS_CHANNELS: ${{ inputs.channels || vars.FINDS_CHANNELS || 'tiktok,instagram-standalone,threads' }}
          TIKTOK_BRANDED: ${{ vars.TIKTOK_BRANDED }}
        run: python scripts/post_short.py out/finds-*.json
      - name: Save state
        if: github.event_name == 'schedule' || inputs.post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finds_used.json shorts_log.json
          git diff --cached --quiet || (git commit -m "chore: finds log [skip ci]" && git pull --rebase -q && git push)
