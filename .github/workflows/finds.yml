name: Finds carousel
# Keeps the next three days of finds posts (slideshow videos) queued in Postiz, which publishes them on time (16:23 and 20:23 Norwegian time).
# GitHub's own scheduler is unreliable, so this only has to wake up now and then to top up the queue and send new TikTok links to Discord.
# To pause: set the repo variable FINDS_LIVE to "false" (and remove queued posts in Postiz).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      now:
        description: 'Make this many carousels and send them as drafts right now (0 = normal run, max 5)'
        default: '0'
      account:
        description: 'Which TikTok account gets them'
        type: choice
        options: [main, second, both]
        default: main
permissions:
  contents: write
concurrency: shorts
jobs:
  finds:
    runs-on: ubuntu-latest
    if: vars.FINDS_LIVE != 'false'
    steps:
      - uses: actions/checkout@v4
      # A run that waited behind another one starts from the commit it was triggered on; take the newest main so the
      # usage records (finds_used.json, slides_used.json, qc_categories.json) the previous run saved are not overwritten.
      - run: git fetch -q --depth=20 origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow imageio-ffmpeg yt-dlp numpy && pip install torch --index-url https://download.pytorch.org/whl/cpu
      # the photo clean-up model (Real-ESRGAN general x4v3 and its denoise twin, xinntao/Real-ESRGAN, BSD-3), checked against known hashes
      - run: |
          mkdir -p scripts/models && cd scripts/models
          u=https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0
          curl -sfL -o realesr-general-x4v3.pth $u/realesr-general-x4v3.pth
          curl -sfL -o realesr-general-wdn-x4v3.pth $u/realesr-general-wdn-x4v3.pth
          printf '%s  %s\n' 8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292 realesr-general-x4v3.pth 1641f8c4464b9f097c9fdda5589273713f67cf59f3d909e0bd688f0cee269dca realesr-general-wdn-x4v3.pth | sha256sum -c - || rm -f *.pth
      - name: Top up the queue and send new links
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          MYCNBOX_WEBHOOK: ${{ secrets.MYCNBOX_WEBHOOK }}
          # owner's choice (15 Oct 2026): photo carousels only, sent to the TikTok app as drafts; the owner adds the sound and posts them
          SHORTS_CHANNELS: tiktok
          FINDS_FOLDER: 10IZ-ip4UjlEy5UMyhXaznvjsfSYZeH6L
          FINDS_MODE: carousel
          # four very good drafts every morning at 5 (owner, 26 Oct 2026; was three since 21 Oct)
          FINDS_SLOTS: '05:00,05:02,05:04,05:06'
          FINDS_FROM: '2026-10-20'             # 19 Oct already had its morning drafts
          FINDS_BEST: '1'                      # look at 8x the photos, drop the blurriest, strongest same-item pairs
          FINDS_DAYS: '2'                      # each carousel takes minutes to build now (photo clean-up), so keep two days queued, not five
          FINDS_SLIDES: '9'
          FINDS_LINKS: '0'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # labels each QC shot's item type once, so a slide pairs two of a kind
          TIKTOK_METHOD: UPLOAD
          TIKTOK_AUTO_MUSIC: 'no'
          FINDS_NOW: ${{ (github.event_name == 'workflow_dispatch' && inputs.account != 'second') && inputs.now || '0' }}
        if: github.event_name != 'workflow_dispatch' || inputs.now == '0' || inputs.account != 'second'
        run: python scripts/finds_plan.py
      # The second TikTok account (Qualityfinds in Postiz) gets rug carousels (scripts/make_rug.py): the boxes cover, then the
      # owner's picked items re-shot on the Margiela rug by Google's image model, with names and site prices. Four drafts every
      # morning at 5 (owner, 26 Oct 2026). One post is built per run. To pause it: set the repo variable SLIDES_LIVE to "false".
      - name: Colour emoji font for the rug covers
        if: vars.SLIDES_LIVE != 'false'
        continue-on-error: true
        run: sudo apt-get install -y -q fonts-noto-color-emoji
      - name: Rug carousels for the second TikTok account (Qualityfinds)
        if: vars.SLIDES_LIVE != 'false' && (github.event_name != 'workflow_dispatch' || inputs.now == '0' || inputs.account != 'main')
        continue-on-error: true
        env:
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          SHORTS_CHANNELS: tiktok
          TIKTOK_ACCOUNT: qualityfinds          # the second TikTok account, reconnected in Postiz as "Qualityfinds" (owner confirmed 22 Oct 2026)
          FINDS_STYLE: rug
          FINDS_MAX_NEW: '1'                   # a rug post takes a few minutes: one per run, the next run (10 minutes later) builds the next
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUG_ENGINE: gemini                   # Google Nano Banana 2 (owner chose it over OpenAI, 22 Oct 2026)
          RUG_MODELS: gemini-3.1-flash-image
          PYTHONUNBUFFERED: '1'
          FINDS_FOLDER: 10IZ-ip4UjlEy5UMyhXaznvjsfSYZeH6L
          FINDS_MODE: carousel
          FINDS_SLOTS: '05:01,05:03,05:05,05:07'   # four drafts every morning at 5 (owner, 26 Oct 2026)
          FINDS_FROM: '2026-10-19'
          FINDS_DAYS: '2'
          FINDS_SLIDES: '6'                    # six slides, several items each (owner, 22 Oct 2026)
          FINDS_OWN: '0'                       # the whole QC pool; the owner's picks (scripts/rug_picks.json) go first
          FINDS_STATE: slides_used.json
          FINDS_AVOID: scripts/slides_exclude.json
          FINDS_LINKS: '0'
          TIKTOK_METHOD: UPLOAD                # sent to the TikTok app as a draft: the owner picks the sound and posts it
          TIKTOK_AUTO_MUSIC: 'no'
          FINDS_NOW: ${{ (github.event_name == 'workflow_dispatch' && inputs.account != 'main') && inputs.now || '0' }}
        run: python scripts/finds_plan.py
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finds_used.json discord_sent.json 2>/dev/null || true
          git add slides_used.json 2>/dev/null || true
          git add scripts/qc_categories.json 2>/dev/null || true
          git add scripts/qc_labels.json 2>/dev/null || true
          git add scripts/qc_items.json 2>/dev/null || true
          git add shorts_log.json shorts_posted.json 2>/dev/null || true   # written when carousels are sent right away (manual "now" runs)
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: finds state [skip ci]"
          # someone else may push at the same moment (a site upload, the stats job): try again a few times before giving up
          for n in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((n * 6))
          done
          echo "::error::the finds state could not be saved: the next run may reuse photos"; exit 1
