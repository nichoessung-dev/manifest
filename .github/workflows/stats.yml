name: Stats
# Every 6 hours: aggregate real product views + favourites into data/stats.json
# (drives the "Most popular" sort and the /admin dashboard). Aggregates only, no personal data.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/bake_stats.py
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # Which product pages may be indexed besides those with QC photos, and which the link check found gone
      # (functions/_lib/signals.js, see scripts/gen_signals.py).
      - run: python scripts/gen_signals.py
      - name: Commit if changed
        run: |
          git add functions/_lib/signals.js
          git add data/stats.json data/dashboard.json 2>/dev/null || git add data/stats.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh view/favourite stats"
            git pull --rebase
            git push
          fi
