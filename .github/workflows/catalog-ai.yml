name: Catalog AI
# Better categories, titles and photos for the catalogue, in batches (see PLAN.md).
#   audit   numbers only (no API calls); report + photo sample in the run's artifacts
#   label   vision labels for the next <limit> finds -> data/catalog_ai.json (resumable; reruns skip done finds)
#   photos  clean product shots (transparent cut-out, soft shadow, same framing) for the next <limit> finds
#           -> Supabase products/pc2/<id>.webp + before/after contact sheets in the run's artifacts.
#           Photos of a person, a hand, a box or a collage are never touched (they need a new photo).
# options (free text, space separated, per step):
#   photos  select=not_clean   only photos the labels call not clean      issues=hanger_or_rack,busy_background  only these
#           recut=yes          rembg on top of the photo's own cut-out (can only remove pixels)
#           rembg=isnet-general-use | birefnet-general-lite              order=best  most viewed first
#           redo=yes           clean again photos that were already done (a new version, ?v=n+1)
#   label   relabel=yes        label the given ids again (ids or ids=@file); the earlier label is kept as a second opinion
# ids: comma separated, or @path/to/file.txt (one id per line, in the repo)
# apply=yes changes index.html, and only through scripts/apply_catalog_ai.py (confident, rule-passing changes;
# old values logged in data/catalog_ai_applied.json for a revert). Without it index.html is never touched.
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'audit, label or photos'
        type: choice
        options: [audit, label, photos]
        default: label
      limit:
        description: 'Finds this run (batches of 500 are safe; 0 = do nothing new, only apply)'
        default: '50'
      ids:
        description: 'Only these ids (comma separated, or @data/file.txt; optional)'
        default: ''
      options:
        description: 'Step options, e.g. photos: select=not_clean issues=hanger_or_rack order=best redo=yes; label: relabel=yes'
        default: ''
      model:
        description: 'Vision model for label: claude-haiku-5-5 (default), claude-sonnet-5-5 (recheck), gemini-2.5-flash, gpt-4o-mini'
        default: 'claude-haiku-5-5'
      recheck_below:
        description: 'Label step: also re-label finds whose saved confidence is below this (e.g. 0.7 with claude-sonnet-5-5); 0 = off'
        default: '0'
      photo_store:
        description: 'Where cleaned photos go: supabase (products/pc2, default) or git (img/p2)'
        type: choice
        options: [supabase, git]
        default: supabase
      apply:
        description: 'Write confident changes into index.html (yes/no)'
        type: choice
        options: ['no', 'yes']
        default: 'no'
      apply_what:
        description: 'With apply=yes: cats, titles, titles_order (titles + colour moved to the end), both, or photos (site shows the cleaned photo)'
        type: choice
        options: [cats, titles, titles_order, both, photos]
        default: cats
      max_usd:
        description: 'Stop the label run when it has spent this much (USD)'
        default: '25'
permissions:
  contents: write
concurrency:
  group: catalog-ai
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      LIMIT: ${{ inputs.limit }}
      IDS: ${{ inputs.ids }}
      MODEL: ${{ inputs.model }}
      OPTIONS: ${{ inputs.options }}
    steps:
      - uses: actions/checkout@v4
      - name: Read options
        id: opt
        run: |
          # options -> step outputs (only known keys, only safe characters)
          for kv in $OPTIONS; do
            k="${kv%%=*}"; v="${kv#*=}"
            case "$k" in select|issues|recut|rembg|order|relabel|redo) ;; *) echo "::error::unknown option $k"; exit 1;; esac
            [[ "$v" =~ ^[A-Za-z0-9_,.-]+$ ]] || { echo "::error::bad value for $k"; exit 1; }
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done
          # ids: a list or @file
          if [[ "$IDS" == @* ]]; then
            f="${IDS#@}"; [[ "$f" =~ ^[A-Za-z0-9_./-]+$ && -f "$f" ]] || { echo "::error::ids file $f not found"; exit 1; }
            echo "ids_args=--ids-file $f" >> "$GITHUB_OUTPUT"
          elif [ -n "$IDS" ]; then
            [[ "$IDS" =~ ^[0-9A-Za-z_,\ -]+$ ]] || { echo "::error::bad ids"; exit 1; }
            echo "ids_args=--ids ${IDS// /}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install pillow
          if [ "${{ inputs.step }}" = "label" ]; then pip install anthropic; fi
          if [ "${{ inputs.step }}" = "photos" ]; then
            pip install "rembg[cpu]>=2.0.59,<3" numpy && pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
      # Real-ESRGAN for photos under 900 px (scripts/restore.py, same files and hashes as finds.yml); without them the
      # cleaner falls back to Lanczos
      - name: Upscale model
        if: inputs.step == 'photos'
        run: |
          mkdir -p scripts/models && cd scripts/models
          u=https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0
          curl -sfL -o realesr-general-x4v3.pth $u/realesr-general-x4v3.pth || true
          curl -sfL -o realesr-general-wdn-x4v3.pth $u/realesr-general-wdn-x4v3.pth || true
          printf '%s  %s\n' 8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292 realesr-general-x4v3.pth 1641f8c4464b9f097c9fdda5589273713f67cf59f3d909e0bd688f0cee269dca realesr-general-wdn-x4v3.pth | sha256sum -c - || rm -f *.pth
      - name: Cache background-removal model
        if: inputs.step == 'photos'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-${{ steps.opt.outputs.rembg || 'isnet-general-use' }}-v1

      - name: Audit
        if: inputs.step == 'audit'
        run: python -u scripts/catalog_audit.py --photos 150 --cache /tmp/audit-photos --out out/catalog_audit.json | tee out-audit.md

      - name: Label (vision model)
        if: inputs.step == 'label' && inputs.limit != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # engine follows the model name: claude-* -> Anthropic (default), gemini-* -> Gemini, gpt-* -> OpenAI.
          # Exit code 3 = the account is out of credit: good labels are kept and committed by the Commit step.
          python -u scripts/catalog_ai.py --model "$MODEL" --limit "$LIMIT" ${{ steps.opt.outputs.ids_args }} \
            --recheck-below "${{ inputs.recheck_below }}" ${{ steps.opt.outputs.relabel == 'yes' && '--redo' || '' }} \
            --order best --workers 6 --max-minutes 80 --max-usd "${{ inputs.max_usd }}"

      - name: Clean photos
        if: inputs.step == 'photos' && inputs.limit != '0'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -u scripts/clean_photos.py --limit "$LIMIT" ${{ steps.opt.outputs.ids_args }} --store "${{ inputs.photo_store }}" --bg none --keep-main-view \
            --from-labels "${{ steps.opt.outputs.select || 'all' }}" ${{ steps.opt.outputs.issues && format('--issues {0}', steps.opt.outputs.issues) || '' }} \
            ${{ steps.opt.outputs.recut == 'yes' && '--recut' || '' }} ${{ steps.opt.outputs.redo == 'yes' && '--redo' || '' }} --rembg-model "${{ steps.opt.outputs.rembg || 'isnet-general-use' }}" \
            --order "${{ steps.opt.outputs.order || 'catalog' }}" --sheets out/photo-sheets --max-minutes 80

      - name: Apply to index.html (only with apply=yes)
        id: apply
        if: inputs.apply == 'yes' && inputs.step != 'audit'
        run: |
          case "${{ inputs.apply_what }}" in
            cats) F="--cats";; titles) F="--titles";; titles_order) F="--titles --reorder-colour";; both) F="--cats --titles";;
            photos) F="--photos --verify";;
          esac
          IDA="${{ steps.opt.outputs.ids_args }}"
          if [[ "$IDA" == --ids-file* ]]; then IDA="--ids $(tr -s '[:space:]' ',' < "${IDA#--ids-file }")"; fi
          python scripts/apply_catalog_ai.py $F $IDA --write --report out/catalog_ai_apply.md --csv out/catalog_ai_apply.csv
          # pushes made with the workflow token do not start other workflows, so regenerate the derived files here
          # (what catalog-sync.yml would do)
          python scripts/gen_catalog.py
          python scripts/sync_catalog.py --no-thumbs

      - name: Keep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-ai-${{ inputs.step }}-${{ github.run_number }}
          path: |
            out/
            out-audit.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit
        if: always() && inputs.step != 'audit'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog_ai.json
          [ -d img/p2 ] && git add img/p2
          MSG="chore: catalog AI ${{ inputs.step }} [skip ci]"
          if [ "${{ inputs.apply }}" = "yes" ] && [ "${{ steps.apply.outcome }}" = "success" ]; then
            git add index.html data/catalog_ai_applied.json functions/_lib/catalog.js products.json sitemap.xml
            MSG="catalog AI: apply ${{ inputs.apply_what }}"      # no [skip ci]: Cloudflare must deploy it
          fi
          # never commit anything else (contact sheets and reports live in the artifacts)
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git diff --cached --stat | tail -3
          git commit -q -m "$MSG"
          for n in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push -q; then exit 0; fi
            sleep $((n * 7))
          done
          echo "::error::could not push the results"; exit 1
