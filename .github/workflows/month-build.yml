name: Month build
run-name: Month build ${{ inputs.account }} x${{ inputs.count }}
# Builds slideshows for the month videos and puts each on the release "month-content" (scripts/month_build.py).
# Nothing is posted here: scripts/local_videos.py adds the owner's voice on the owner's PC, the Month queue workflow schedules them.
on:
  workflow_dispatch:
    inputs:
      account:
        description: 'main-rug (puroclassico.com, AI closet-rug photos of the owner picks), main (real QC photos) or second (Qualityfinds, rug pictures from Google credit)'
        type: choice
        options: ['second', 'main', 'main-rug']
        default: 'second'
      count:
        description: 'How many slideshows'
        type: string
        default: '10'
      replace:
        description: 'Remake the queued, not yet posted slideshows under their own names (6 parallel jobs; second reuses saved photos)'
        type: boolean
        default: false
      max_images:
        description: 'Most images Google may make for one slideshow (second only)'
        type: string
        default: '16'
permissions:
  contents: write
concurrency: month-build-${{ inputs.account }}-${{ inputs.replace }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.replace && inputs.account == 'main' && '[0,1,2,3,4,5]' || '[0]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow imageio-ffmpeg numpy && (sudo apt-get install -y -q fonts-noto-color-emoji || true)
      - if: inputs.account == 'main'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          mkdir -p scripts/models && cd scripts/models
          u=https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0
          curl -sfL -o realesr-general-x4v3.pth $u/realesr-general-x4v3.pth
          curl -sfL -o realesr-general-wdn-x4v3.pth $u/realesr-general-wdn-x4v3.pth
          printf '%s  %s\n' 8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292 realesr-general-x4v3.pth 1641f8c4464b9f097c9fdda5589273713f67cf59f3d909e0bd688f0cee269dca realesr-general-wdn-x4v3.pth | sha256sum -c - || rm -f *.pth
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
          # Qualityfinds: Google makes the pictures, Claude does every check (owner, 25 Nov 2026). No OpenAI fallback.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}   # every image made is saved for good (make_rug save_all_made / save_library)
          RUG_ENGINE: gemini
          RUG_MODELS: ${{ inputs.account == 'main-rug' && 'gemini-nano-banana-2.1,gemini-3.1-flash-image' || 'gemini-3.1-flash-image' }}     # 27 Nov 2026: Nano Banana 2.1 is half the price and ranks higher (research report)
          RUG_LOOK: claude
          RUG_MIN_SLIDES: '4'                  # 25 Nov 2026: 4 good slides still make a 20 s video; a thin build is no longer thrown away
          RUG_REAL_MIN: ${{ inputs.account == 'main-rug' && '6' || '8' }}     # 27 Nov 2026: owner: 6 for the main account's mixed slides                    # 26 Nov 2026: owner wants stricter realism (was 6)
          RUG_NO_WATCH: '1'                    # 26 Nov 2026: owner: the fake-looking products are almost always the watches
          RUG_SOURCE: mix                      # 26 Nov 2026: the most popular finds plus the puroclassico account's own items (site QC photos, Drive)
          RUG_POP_N: '120'                     # only the most popular finds (was the top 300)
          RUG_MAX_IMAGES: ${{ inputs.max_images }}
          # main account: the same settings as its daily carousels (finds.yml)
          FINDS_FOLDER: 10IZ-ip4UjlEy5UMyhXaznvjsfSYZeH6L
          FINDS_BEST: '1'
          FINDS_SLIDES: ${{ inputs.account == 'main' && '9' || '6' }}
          MAIN_RUG: ${{ inputs.account == 'main-rug' && '1' || '' }}     # 27 Nov 2026: owner's picks on the closet rug (scripts/main_picks.json)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ inputs.replace }}" = "true" ]; then
            n=1; [ "${{ inputs.account }}" = "main" ] && n=6
            python scripts/month_build.py --account "${{ inputs.account }}" --replace --shard "${{ matrix.shard }}/$n" --minutes 330
          else
            python scripts/month_build.py --account "${{ inputs.account == 'main-rug' && 'main' || inputs.account }}" --count "${{ inputs.count }}" --minutes 320
          fi
