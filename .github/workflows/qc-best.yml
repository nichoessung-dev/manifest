name: QC best photo
# Picks the best QC photo per find for the card hover (scripts/qc_best.py, Claude Haiku, under 1 cent per find, once).
# Daily after the QC photo bank; data/qc_best.json holds only photo numbers.
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qc-best
  cancel-in-progress: false
jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet anthropic==1.14.0
      - name: Pick
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -u scripts/qc_best.py
      - name: Commit if changed
        if: success()
        run: |
          git add data/qc_best.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: best QC photo per find"
          for i in 1 2 3; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            sleep 10
          done
          exit 1
