name: Style previews
# Renders several style videos (scripts/styles.json) with the voice in one run and puts them on the "previews-batch" branch.
# Nothing is posted. Pictures come from the asset library (branch "assets"); make missing ones with the Assets workflow first.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Style ids, comma separated'
        required: true
        type: string
permissions:
  contents: write
concurrency: style-previews
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow imageio-ffmpeg
      - name: Render each style (voice on, no posting)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          IDS: ${{ inputs.ids }}
        run: |
          mkdir -p batch
          IFS=',' read -ra LIST <<< "$IDS"
          for raw in "${LIST[@]}"; do
            id="$(printf '%s' "$raw" | tr -d '[:space:]')"
            case "$id" in ''|*[!a-z0-9-]*) echo "::warning::skipping an id that is not a style id"; continue;; esac
            rm -rf "out-$id"
            if python scripts/make_short.py --format style --id "$id" --out "out-$id" > "batch/$id.log" 2>&1; then
              cp "out-$id"/*.mp4 "batch/$id.mp4"; cp "out-$id"/*.json "batch/$id.json"; echo "rendered $id"
            else
              echo "::warning::render failed for $id"; tail -5 "batch/$id.log"
            fi
            grep -h "WARNING" "batch/$id.log" || true
          done
          ls -la batch
      - name: Publish (branch "previews-batch", replaced each run)
        run: |
          cd batch && git init -q -b previews-batch
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "style previews [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews-batch
