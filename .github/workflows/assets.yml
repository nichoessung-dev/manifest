name: Assets
# Generated images and stock clips for the videos. This first version only checks the keys.
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the keys
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python scripts/assets_probe.py
      - name: Publish the report (to the "assets-probe" branch)
        run: |
          rm -rf /tmp/probe && mkdir -p /tmp/probe && cp -r out/probe/. /tmp/probe/
          cd /tmp/probe && git init -q -b assets-probe
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "probe [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" assets-probe
