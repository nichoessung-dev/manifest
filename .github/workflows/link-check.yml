name: Link check
# Every Monday: look up every Weidian find on Weidian's public item API and write data/link_health.json
# (dead and sold-out listings). The site hides dead finds and /stats lists them. Taobao/1688 can't be checked this way.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: link-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/check_links.py
      - name: Save the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link_health.json
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: link check"   # no [skip ci]: Cloudflare Pages must deploy the new file
          for n in 1 2 3 4 5; do
            if git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((n * 6))
          done
          exit 1
