name: QC photo bank
# Looks up QC photos once per find and stores them in our own storage (scripts/qc_bank.py), so they show for every
# visitor without spending the qualit.ly monthly quota. Free plan (1,000 lookups a month): each run uses at most "max"
# and always leaves 150 a month for visitors. Paid plan (10,000+ a month, owner 19 Nov 2026: "Save QC photos in bulk"):
# every find is looked up, up to 12 photos each, and the job starts its next run until nothing is left.
# Then the catalogue's QC counts are raised from the bank (scripts/apply_qc_counts.py) so the app shows the photos.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: 'Most lookups this run'
        default: '1000'
      reserve:
        description: 'Lookups left untouched for visitors this month'
        default: '150'
permissions:
  contents: write
  actions: write
concurrency: qc-bank
jobs:
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy opencv-python-headless qrcode cryptography
      - name: Look up and store QC photos
        env:
          QUALITLY_KEY: ${{ secrets.QUALITLY_KEY }}
          OOPBUY_APP_ID: ${{ secrets.OOPBUY_APP_ID }}
          OOPBUY_AES_KEY: ${{ secrets.OOPBUY_AES_KEY }}
          OOPBUY_SIGN_SECRET: ${{ secrets.OOPBUY_SIGN_SECRET }}
          REPSAPI_KEY: ${{ secrets.REPSAPI_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          python -u scripts/qc_bank.py --max "${{ inputs.max || '1000' }}" --reserve "${{ inputs.reserve || '150' }}" | tee out-bank.log
      - name: Save the bank
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qc_bank.json
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: QC photo bank [skip ci]"
          for n in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push -q; then exit 0; fi
            sleep $((n * 7))
          done
          echo "::error::the QC bank could not be saved"; exit 1
      - name: QC counts into the catalogue
        if: success()
        run: |
          python scripts/apply_qc_counts.py
          git diff --quiet index.html && { echo "no count changes"; exit 0; }
          python scripts/gen_catalog.py
          python scripts/sync_catalog.py --no-thumbs
          python scripts/gen_signals.py || true
          git add -A index.html functions/_lib/catalog.js functions/_lib/signals.js products.json sitemap.xml
          git commit -q -m "QC counts from the photo bank"
          for n in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push -q; then exit 0; fi
            sleep $((n * 7))
          done
          echo "::error::the QC counts could not be saved"; exit 1
      - name: Next run (paid plan)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LEFT=$(grep -o 'still to look up after this run: [0-9]*' out-bank.log | grep -o '[0-9]*$' || echo 0)
          if grep -q "bulk mode" out-bank.log && [ "${LEFT:-0}" -gt 0 ] && ! grep -q "qualit.ly unavailable" out-bank.log; then
            echo "$LEFT finds left: starting the next run"; gh workflow run qc-bank.yml --ref "$GITHUB_REF_NAME"
          fi
