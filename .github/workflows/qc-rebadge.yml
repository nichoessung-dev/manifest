name: QC photos badge swap
# One-off (26 Nov 2026): the qualit.ly corner badge on saved QC photos becomes our QR code to puroclassico.com
# (scripts/qc_rebadge.py). New photos get it in the nightly QC bank job.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Most photos this run (0 = all)'
        default: '0'
permissions:
  contents: write
concurrency: qc-bank
jobs:
  rebadge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy opencv-python-headless qrcode
      - name: Swap the badges
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -u scripts/qc_rebadge.py --limit "${{ inputs.limit || '0' }}"
      - name: Save the list
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qc_rebadged.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "chore: QC badge swap list [skip ci]"
          for n in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push -q; then exit 0; fi
            sleep $((n * 7))
          done
