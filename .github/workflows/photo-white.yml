name: Photo white cut-outs
# Pure white cut-outs (owner, 23 Nov 2026: "remove the background on the products with a background"; the item cut out
# on #FFFFFF, SSENSE / Mr Porter style) for the photos in data/photo_white_targets.json, made by scripts/photo_white.py:
# the store original found again (or the live file un-premultiplied), BiRefNet / ISNet cut-out (BiRefNet_HR for what
# those cannot do), 1600 x 1600 on #FFFFFF, and every check of the polish step (outline, interior, regression,
# fidelity). Nothing is uploaded or pushed: the new files, the results (data/photo_white/<k>-of-<n>.json) and
# before / after sheets come back as this run's artifact, are reviewed and committed by hand, and the apply step
# switches the site. Read-only on purpose: the BiRefNet_HR model code comes from HuggingFace (pinned revisions).
#   shard k/n: the finds of shard k of n (parallel runs). Live store photos are read through the site's edge cache.
on:
  workflow_dispatch:
    inputs:
      shard:
        description: 'k/n: only shard k of n (e.g. 0/12 .. 11/12); 0/1 = all'
        default: '0/1'
      group:
        description: 'Groups: a (store mains), b (store angles), c (RepLibrary mains), d (cut-outs that lost part of the item)'
        default: 'a,b,c'
      ids:
        description: 'Only these find ids (comma separated, optional)'
        default: ''
      models:
        description: 'Cut-out models, tried in this order (HR ones only when the fast ones fail on the matte)'
        default: 'birefnet-general,isnet-general-use,birefnet-hr,birefnet-hr-matting'
      max_minutes:
        description: 'Stop starting new photos after this many minutes'
        default: '300'
      hr_size:
        description: 'Size the HR BiRefNets run at (2048 = as trained; smaller needs less memory)'
        default: '2048'
      retry:
        description: 'Also redo the photos not fixed before (not those the photo itself rules out); all = redo every photo'
        type: choice
        options: ['no', 'yes', 'all']
        default: 'no'
permissions:
  contents: read
concurrency: photo-white-${{ inputs.shard || '0/1' }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SHARD: ${{ inputs.shard || '0/1' }}
      GROUP: ${{ inputs.group || 'a,b,c' }}
      IDS: ${{ inputs.ids }}
      MODELS: ${{ inputs.models || 'birefnet-general,isnet-general-use,birefnet-hr,birefnet-hr-matting' }}
      MAXMIN: ${{ inputs.max_minutes || '300' }}
      RETRY: ${{ inputs.retry || 'no' }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      PHOTO_WHITE_HR_SIZE: ${{ inputs.hr_size || '2048' }}
    steps:
      - name: Check inputs
        run: |
          [[ "$SHARD" =~ ^[0-9]{1,2}/[0-9]{1,2}$ ]] || { echo "::error::bad shard"; exit 1; }
          [[ "$GROUP" =~ ^[abcd](,[abcd]){0,3}$ ]] || { echo "::error::bad group"; exit 1; }
          [[ -z "$IDS" || "$IDS" =~ ^[0-9,\ ]+$ ]] || { echo "::error::bad ids"; exit 1; }
          [[ "$MODELS" =~ ^[a-z0-9,-]+$ ]] || { echo "::error::bad models"; exit 1; }
          [[ "$MAXMIN" =~ ^[0-9]{1,3}$ ]] || { echo "::error::bad max_minutes"; exit 1; }
          [[ "$PHOTO_WHITE_HR_SIZE" =~ ^[0-9]{3,4}$ ]] || { echo "::error::bad hr_size"; exit 1; }
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            data
            img/rl
            img/fr
            img/p
            img/p2
            img/m/pc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install pillow numpy scipy "rembg[cpu]==2.0.87"
          pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.44,<5" timm einops kornia safetensors
      - name: Upscale model
        run: |
          mkdir -p scripts/models && cd scripts/models
          u=https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0
          curl -sfL -o realesr-general-x4v3.pth $u/realesr-general-x4v3.pth || true
          curl -sfL -o realesr-general-wdn-x4v3.pth $u/realesr-general-wdn-x4v3.pth || true
          printf '%s  %s\n' 8dc7edb9ac80ccdc30c3a5dca6616509367f05fbc184ad95b731f05bece96292 realesr-general-x4v3.pth 1641f8c4464b9f097c9fdda5589273713f67cf59f3d909e0bd688f0cee269dca realesr-general-wdn-x4v3.pth | sha256sum -c - || rm -f *.pth
      - name: Cache background-removal models
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.cache/huggingface
          key: photo-white-models-v1-a7a562f6-5d6b6f8a
      - name: Shard tag
        id: tag
        run: echo "tag=${SHARD/\//-of-}" >> "$GITHUB_OUTPUT"
      - name: Cut out
        run: |
          set -o pipefail
          IDA=""; [ -n "$IDS" ] && IDA="--ids ${IDS// /}"
          RT=""; [ "$RETRY" = "yes" ] && RT="--retry"; [ "$RETRY" = "all" ] && RT="--redo"
          python -u scripts/photo_white.py --shard "$SHARD" --group "$GROUP" --models "$MODELS" --max-minutes "$MAXMIN" $IDA $RT 2>&1 \
            | grep -v -i -E 'warning|warn\(' | tee photo-white.log
      - name: Keep the log with the files
        if: always()
        run: mkdir -p out/photo-white && cp photo-white.log out/photo-white/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-white-${{ steps.tag.outputs.tag }}
          path: |
            img/white
            data/photo_white
            out/photo-white
          if-no-files-found: warn
          retention-days: 14
