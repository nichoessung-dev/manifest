<style>
@font-face{font-family:"Instrument Sans";src:url(/fonts/instrument-sans-latin.woff2) format("woff2");font-weight:400 700;font-display:swap}
:root{
  --bg:#000;--ink:#fff;--muted:rgba(255,255,255,.72);--faint:rgba(255,255,255,.5);--line:rgba(255,255,255,.14);
  --glass:rgba(20,22,26,.55);--glass-2:rgba(255,255,255,.12);--red:#D9301E;--red-hover:#C42A1A;--like:#ff3b5c;
  --ease:cubic-bezier(.2,.7,.2,1);--f:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* feed column: full screen on phones, a phone-shaped column on desktop */
#feed{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;outline:none}
#feed::-webkit-scrollbar{display:none}
.slide{touch-action:manipulation;content-visibility:auto;position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;contain:strict}
@media (min-width:700px){
  #feed{left:50%;right:auto;width:min(480px,100vw);transform:translateX(-50%)}
  .slide{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

/* photos: seller photo first, then QC photos sideways */
.bgblur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.1) brightness(.4);transform:scale(1.1)}
.track{touch-action:pan-x pan-y;position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.ph{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:calc(var(--top) + 64px) 0 220px}
/* the seller photo sits on the same light card as on the main site: many are cut-outs whose edges look broken on black */
.pcard{flex:none;width:min(calc(100% - 24px),calc(100vh - var(--top) - 284px));width:min(calc(100% - 24px),calc(100dvh - var(--top) - 284px));aspect-ratio:1/1;background:#f2f5fa;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.pcard img{border-radius:0!important}
.ph.qc img{border-radius:14px}
.ph img{width:100%;height:100%;object-fit:contain;image-rendering:auto;border-radius:4px;user-select:none;-webkit-user-drag:none;opacity:0;transition:opacity .25s var(--ease)}
.ph img.ok{opacity:1}
.ph.qc{position:relative}
.qctag{position:absolute;left:12px;top:calc(var(--top) + 64px);font:600 12px/1 var(--f);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:6px 8px;border-radius:6px}
.dots{position:absolute;left:0;right:0;bottom:200px;z-index:4;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);transition:width .2s var(--ease),background-color .2s var(--ease)}
.dots i.on{width:16px;background:#fff}
/* photo arrows for mouse users (touch screens swipe) */
.phnav{position:absolute;top:calc(50% - 60px);z-index:4;width:44px;height:44px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:opacity .15s var(--ease),background-color .15s var(--ease)}
.phnav svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.phnav.prev{left:12px}.phnav.next{right:12px}
.phnav[disabled]{opacity:0;pointer-events:none}
.phnav:active{transform:scale(.96)}
.phnav:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (hover:hover) and (pointer:fine){.slide.hasqc .phnav{display:flex}.phnav:hover{background:rgba(40,44,50,.8)}.slide.hasqc .track{cursor:grab}}
.dots i{pointer-events:auto;cursor:pointer}
.shade{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.45) 55%,transparent);pointer-events:none}

/* text + buttons */
.info{position:absolute;left:16px;right:84px;bottom:calc(var(--bot) + 86px);pointer-events:none}
.info>*{pointer-events:auto}
.why{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f);color:var(--muted);background:var(--glass-2);padding:6px 8px;border-radius:999px;margin-bottom:10px}
.brand{font-weight:700;font-size:15px;text-decoration:none;display:inline-block;margin-bottom:4px}
.title{font-size:15px;line-height:1.3;margin:0 0 8px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.price{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;margin-right:4px}
.chip{font:500 12px/1 var(--f);color:var(--muted);border:1px solid var(--line);padding:5px 7px;border-radius:999px;text-decoration:none}
button.chip{cursor:pointer}
.rail{position:absolute;right:8px;bottom:calc(var(--bot) + 92px);display:flex;flex-direction:column;align-items:center;gap:14px}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;width:56px;font:600 11px/1 var(--f);color:var(--ink);text-shadow:0 1px 2px rgba(0,0,0,.4);text-decoration:none}
.rb .ic{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s var(--ease),background-color .15s var(--ease)}
.rb:active .ic{transform:scale(.96)}
.rb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb.on .ic{color:var(--like)}
.rb.on svg.heart{fill:currentColor}
.rb.saved svg.bm{fill:currentColor}
.rb:focus-visible .ic,.buy:focus-visible,.tab:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (hover:hover){.rb:hover .ic{background:rgba(40,44,50,.75)}}
.buyrow{position:absolute;left:16px;right:16px;bottom:calc(var(--bot) + 18px);height:52px;display:flex;border-radius:999px;box-shadow:0 6px 20px rgba(217,48,30,.35)}
.agsw{flex:none;width:56px;height:52px;border-radius:0 999px 999px 0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.28);transition:background-color .15s var(--ease)}
.agsw svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.agsw:active{background:var(--red-hover)}
@media (hover:hover){.agsw:hover{background:var(--red-hover)}}
.agsw:focus-visible{outline:2px solid #fff;outline-offset:2px}
.agl{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line);text-align:left}
.agl:last-child{border-bottom:0}
.agl img{width:32px;height:32px;border-radius:8px}
.agl .ck{margin-left:auto;width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.agl[aria-checked="true"] .ck{opacity:1}
.buy{flex:1;min-width:0;height:52px;border-radius:999px 0 0 999px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;text-decoration:none;transition:background-color .15s var(--ease),transform .15s var(--ease)}
.buy:active{background:var(--red-hover)}
@media (hover:hover){.buy:hover{background:var(--red-hover)}}
.buy img{width:20px;height:20px;border-radius:5px}

/* like burst */
.burst{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;color:var(--like);animation:burst .7s var(--ease) forwards;z-index:5}
.burst svg{width:100%;height:100%;fill:currentColor;filter:drop-shadow(0 4px 16px rgba(0,0,0,.35))}
@keyframes burst{0%{transform:scale(.25);opacity:0}25%{transform:scale(1.1);opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1) translateY(-40px);opacity:0}}

/* top bar */
.top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(var(--top) + 10px) 12px 10px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent);pointer-events:none}
.top>*{pointer-events:auto}
@media (min-width:700px){.top{left:50%;right:auto;width:min(480px,100vw);transform:translateX(-50%)}}
.tbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-decoration:none}
.tbtn svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:4px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:4px;border-radius:999px}
.tab{height:32px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:background-color .15s var(--ease),color .15s var(--ease)}
.tab[aria-selected="true"]{background:#fff;color:#000}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:80dvh;overflow:auto;background:#121519;border-radius:20px 20px 0 0;padding:8px 16px calc(var(--bot) + 20px);transform:translateY(100%);transition:transform .28s var(--ease)}
@media (min-width:700px){.sheet{left:50%;right:auto;width:min(480px,100vw);transform:translate(-50%,100%)}.sheet.open{transform:translate(-50%,0)!important}}
.sheet.open{transform:translateY(0)}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.sheet h2{font-size:18px;margin:0 0 4px}
.sheet p{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.45}
.sec{font:600 13px/1 var(--f);color:var(--faint);margin:16px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:500;transition:background-color .15s var(--ease),color .15s var(--ease)}
.opt[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}
.row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;height:46px;border-radius:999px;font-weight:700;font-size:15px;background:#fff;color:#000}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--line)}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;font-size:15px;text-align:left;border-bottom:1px solid var(--line);text-decoration:none}
.mi:last-child{border-bottom:0}
.mi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.liked{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.liked a{aspect-ratio:1;border-radius:8px;overflow:hidden;background:#1c2026;display:block}
.liked img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:50%;top:calc(var(--top) + 64px);z-index:60;transform:translate(-50%,-8px);background:#fff;color:#000;font-weight:600;font-size:14px;padding:10px 14px;border-radius:999px;opacity:0;transition:opacity .2s var(--ease),transform .2s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* first-visit hint + loader */
.hint{pointer-events:none;position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.55);font-weight:600;font-size:17px;text-align:center;padding:24px;transition:opacity .3s var(--ease)}
.hint.off{opacity:0;pointer-events:none}
.hint svg{width:44px;height:44px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:up 1.4s var(--ease) infinite}
.hint small{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:6px;max-width:30ch}
@keyframes up{0%{transform:translateY(18px);opacity:0}30%{opacity:1}100%{transform:translateY(-18px);opacity:0}}
.load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:14px;z-index:10}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.endc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;text-align:center;padding:24px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}#feed{scroll-behavior:auto}}
</style>
</head>

  if (br) { var bl = br.toLowerCase(); S.w["b:" + (ALL.find(function (p) { return p.brand && p.brand.toLowerCase() === bl; }) || {}).brand] = 3; }
  $("#load").remove();
  reset(first);
  if (!LS.get("pc.feed.hint", 0)) { hintOn = true; $("#hint").classList.remove("off"); setTimeout(hideHint, 4000); }
  feed.focus({ preventScroll: true });
}).catch(function () {
  $("#load").innerHTML = '<div>Could not load the finds.</div><a class="chip" href="/feed">Try again</a>';
});
})();
</script>
