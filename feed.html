<style>
@font-face{font-family:"Instrument Sans";src:url(/fonts/instrument-sans-latin.woff2) format("woff2");font-weight:400 700;font-display:swap}
:root{
  --bg:#000;--ink:#fff;--muted:rgba(255,255,255,.72);--faint:rgba(255,255,255,.5);--line:rgba(255,255,255,.14);
  --glass:rgba(20,22,26,.55);--glass-2:rgba(255,255,255,.14);--red:#D9301E;--red-hover:#C42A1A;
  --nope:#ff4d5e;--yes:#1fd18b;--photo:#f2f5fa;
  --ease:cubic-bezier(.2,.7,.2,1);--f:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}

/* the app column: full screen on phones, a phone-sized column on desktop */
.app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;display:flex;flex-direction:column}
.top{flex:none;padding:calc(var(--top) + 10px) 12px 8px;display:flex;align-items:center;justify-content:space-between;z-index:20}
.tbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass-2);text-decoration:none;transition:background-color .15s var(--ease)}
.tbtn svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.tbtn:hover{background:rgba(255,255,255,.22)}}
.tabs{display:flex;gap:4px;background:var(--glass-2);padding:4px;border-radius:999px}
.tab{height:32px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:background-color .15s var(--ease),color .15s var(--ease)}
.tab[aria-selected="true"]{background:#fff;color:#000}

/* the card stack */
.deck{position:relative;flex:1;min-height:0;margin:4px 12px 0}
.card{position:absolute;inset:0;border-radius:22px;overflow:hidden;background:#15181c;box-shadow:0 8px 24px rgba(0,0,0,.4);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transform:translate3d(0,0,0);backface-visibility:hidden;contain:layout paint}
.card.top{will-change:transform}
.card.drag{cursor:grabbing}
.card.under{transform:translate3d(0,10px,0) scale(.95);pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}
/* the dim on the card underneath lifts with the drag (--p = drag progress), so nothing pops when it comes to the top */
.card::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s ease}
.card.under::after{opacity:calc(.3 - .3 * var(--p,0));will-change:opacity}
.card.drag~.card,.deck.dragging .card.under,.deck.dragging .card.under::after{transition:none}
.card.in{opacity:0}
.card.top{z-index:2;transition:none}
.card{transition:opacity .2s ease}
.card.fly{transition:transform .38s cubic-bezier(.25,.6,.3,1),opacity .38s ease;pointer-events:none}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--photo)}
.ph.qc{background:#0d0f12}
.ph img{width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;pointer-events:none;opacity:0;transition:opacity .2s var(--ease)}
.ph img.ok{opacity:1}
.ph.seller img{padding:18px 18px 150px}
.bars{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:4px;z-index:3;pointer-events:none}
.bars i{flex:1;height:4px;border-radius:2px;background:rgba(0,0,0,.25);box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
.bars i.on{background:#fff}
.ph.qc~.bars i{background:rgba(255,255,255,.3)}
.qctag{position:absolute;left:12px;top:24px;z-index:3;font:600 12px/1 var(--f);background:rgba(0,0,0,.55);padding:6px 9px;border-radius:999px;pointer-events:none}
.qctag[hidden]{display:none}
.shade{position:absolute;left:0;right:0;bottom:0;height:52%;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.5) 50%,transparent);pointer-events:none}
.info{position:absolute;left:16px;right:16px;bottom:16px;z-index:3}
.why{display:inline-flex;align-items:center;font:600 12px/1 var(--f);color:#fff;background:rgba(255,255,255,.18);padding:6px 9px;border-radius:999px;margin-bottom:10px}
.nm{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.brand{font-weight:700;font-size:22px;line-height:1.1;text-decoration:none;text-wrap:balance}
.price{font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.title{font-size:15px;line-height:1.3;margin:4px 0 10px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:500 12px/1 var(--f);color:#fff;border:1px solid rgba(255,255,255,.25);padding:6px 9px;border-radius:999px;text-decoration:none}
button.chip{cursor:pointer}
.more{position:absolute;right:12px;top:24px;z-index:4;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.more svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
/* the LIKE / NOPE stamps that appear while dragging */
.glow{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:22px;opacity:0}
.glow.yes{box-shadow:inset 0 0 0 3px rgba(31,209,139,.9),inset 0 0 60px rgba(31,209,139,.45)}
.glow.no{box-shadow:inset 0 0 0 3px rgba(255,77,94,.9),inset 0 0 60px rgba(255,77,94,.45)}
.deck{touch-action:none}
.card{-webkit-touch-callout:none}
.stamp{transform-origin:center;}
.card.drag .stamp{will-change:opacity,transform;transition:transform .12s var(--ease)}
.card.drag .glow{will-change:opacity}
.stamp{position:absolute;top:56px;z-index:5;padding:6px 12px;border:4px solid;border-radius:10px;font-weight:700;font-size:34px;letter-spacing:.04em;opacity:0;pointer-events:none}
.stamp.yes{left:20px;color:var(--yes);transform:rotate(-14deg)}
.stamp.no{right:20px;color:var(--nope);transform:rotate(14deg)}

/* the buttons under the deck */
.ctrl{flex:none;display:flex;align-items:center;justify-content:center;gap:18px;padding:14px 0 10px}
.cb{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#16191d;box-shadow:0 0 0 1px var(--line) inset;transition:transform .15s var(--ease),background-color .15s var(--ease)}
.cb:active{transform:scale(.96)}
.cb svg{width:26px;height:26px;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cb.big{width:68px;height:68px}
.cb.big svg{width:32px;height:32px}
.cb.no svg{stroke:var(--nope)}
.cb.yes svg{stroke:var(--yes);fill:var(--yes)}
.cb.sm{width:46px;height:46px}
.cb.sm svg{width:22px;height:22px;stroke:#fff}
.cb[disabled]{opacity:.35;pointer-events:none}
.cb:focus-visible,.buy:focus-visible,.tab:focus-visible,.agsw:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (hover:hover){.cb:hover{background:#1f2328}}
.buyrow{flex:none;display:flex;margin:0 12px calc(var(--bot) + 12px);height:52px;border-radius:999px;box-shadow:0 6px 20px rgba(217,48,30,.3)}
.buy{flex:1;min-width:0;border-radius:999px 0 0 999px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;text-decoration:none;transition:background-color .15s var(--ease)}
.buy img{width:20px;height:20px;border-radius:5px}
.agsw{flex:none;width:56px;border-radius:0 999px 999px 0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.28);transition:background-color .15s var(--ease)}
.agsw svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.buy:active,.agsw:active{background:var(--red-hover)}
@media (hover:hover){.buy:hover,.agsw:hover{background:var(--red-hover)}}

/* sheets, toast, hint, loader */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:480px;margin:0 auto;max-height:80dvh;overflow:auto;background:#121519;border-radius:20px 20px 0 0;padding:8px 16px calc(var(--bot) + 20px);transform:translateY(100%);transition:transform .28s var(--ease)}
.sheet.open{transform:translateY(0)}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.sheet h2{font-size:18px;margin:0 0 4px}
.sheet p{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.45}
.sec{font:600 13px/1 var(--f);color:var(--faint);margin:16px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:500;transition:background-color .15s var(--ease),color .15s var(--ease)}
.opt[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}
.row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;height:46px;border-radius:999px;font-weight:700;font-size:15px;background:#fff;color:#000}
.btn.ghost{background:transparent;color:#fff;border:1px solid var(--line)}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;font-size:15px;text-align:left;border-bottom:1px solid var(--line);text-decoration:none}
.mi:last-child{border-bottom:0}
.mi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.agl{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line);text-align:left}
.agl:last-child{border-bottom:0}
.agl img{width:32px;height:32px;border-radius:8px}
.agl .ck{margin-left:auto;width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.agl[aria-checked="true"] .ck{opacity:1}
.liked{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.liked a{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--photo);display:block}
.liked img{width:100%;height:100%;object-fit:contain}
.toast{position:fixed;left:50%;top:calc(var(--top) + 64px);z-index:60;transform:translate(-50%,-8px);background:#fff;color:#000;font-weight:600;font-size:14px;padding:10px 14px;border-radius:999px;opacity:0;transition:opacity .2s var(--ease),transform .2s var(--ease);pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{pointer-events:none;position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.6);font-weight:600;font-size:17px;text-align:center;padding:24px;transition:opacity .3s var(--ease)}
.hint.off{opacity:0}
.hint .hs{display:flex;gap:28px;align-items:center}
.hint .hs span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px}
.hint svg{width:40px;height:40px;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hint small{display:block;font-weight:400;font-size:14px;color:var(--muted);max-width:30ch}
.load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:14px;z-index:10}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.endc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--muted);border-radius:22px;background:#15181c}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
