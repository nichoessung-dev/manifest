<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Puro Classico Partners</title>
<meta name="theme-color" content="#FFFFFF">
<script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem("manifest.theme")}catch(e){}if(t!=="light"&&t!=="dark"&&t!=="system")t="light";d.setAttribute("data-theme-pref",t);if(t!=="system")d.setAttribute("data-theme",t);d.classList.add("js");try{var k=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches),m=document.querySelector('meta[name="theme-color"]');if(m)m.content=k?"#0A0A0A":"#FFFFFF"}catch(e){}})();</script>
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* v9 dashboard shell, shared by /stats and /admin (copies of the ds.css tokens: keep both pages in step with ds.css) */
  @font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/inter-latin.woff2) format("woff2")}
  :root{
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --r-sm:8px; --r-md:10px; --r-lg:12px; --r-pill:999px; --maxw:1280px;
    --ease-out:cubic-bezier(.22,1,.36,1);
    --bg:#FFFFFF; --ink:#0A0A0A; --ink-2:#404040; --surface:#FFFFFF; --surface-2:#F5F5F5; --muted:#6B6B6B;
    --line:#E5E5E5; --line-2:#E5E5E5; --fill:#171717; --fill-ink:#FAFAFA; --ring:#737373; --input-line:#949494; --hover:#F5F5F5;
    --header:rgba(255,255,255,.6); --header-solid:#FFFFFF;
    --sh-sm:0 1px 2px rgba(0,0,0,.05); --sh-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);
    /* chart + status colours */
    --c1:#0A0A0A; --c2:#A3A3A3; --grid:#EDEDED; --axis:#737373; --ok:#15803D; --live:#22C55E; --sk:#EDEDED; --sk-hi:#F7F7F7; --seg-on:#FFFFFF;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0A0A0A; --ink:#FAFAFA; --ink-2:#D4D4D4; --surface:#171717; --surface-2:#262626; --muted:#A1A1A1;
    --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.15); --fill:#E5E5E5; --fill-ink:#171717; --input-line:rgba(255,255,255,.4); --hover:#262626;
    --header:rgba(10,10,10,.6); --header-solid:#0A0A0A;
    --sh-sm:0 1px 2px rgba(0,0,0,.3); --sh-md:0 4px 6px -1px rgba(0,0,0,.4),0 2px 4px -2px rgba(0,0,0,.4);
    --c1:#FAFAFA; --c2:#737373; --grid:#262626; --axis:#8A8A8A; --ok:#4ADE80; --sk:#232323; --sk-hi:#2E2E2E; --seg-on:#404040;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0A0A0A; --ink:#FAFAFA; --ink-2:#D4D4D4; --surface:#171717; --surface-2:#262626; --muted:#A1A1A1;
    --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.15); --fill:#E5E5E5; --fill-ink:#171717; --input-line:rgba(255,255,255,.4); --hover:#262626;
    --header:rgba(10,10,10,.6); --header-solid:#0A0A0A;
    --sh-sm:0 1px 2px rgba(0,0,0,.3); --sh-md:0 4px 6px -1px rgba(0,0,0,.4),0 2px 4px -2px rgba(0,0,0,.4);
    --c1:#FAFAFA; --c2:#737373; --grid:#262626; --axis:#8A8A8A; --ok:#4ADE80; --sk:#232323; --sk-hi:#2E2E2E; --seg-on:#404040;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font:400 15px/1.5 var(--font);font-feature-settings:"cv11","ss01";overflow-x:hidden}
  a{color:inherit;text-underline-offset:3px}
  button{font:inherit;color:inherit}
  a,button,label,select{touch-action:manipulation}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
  [hidden]{display:none!important}
  .w{max-width:var(--maxw);margin:0 auto;padding:0 32px}
  @media (max-width:640px){.w{padding:0 16px}}

  /* header: same build as the site header, compact */
  header.h{position:sticky;top:0;z-index:30;background:var(--header-solid);border-bottom:1px solid var(--line)}
  @supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){header.h{background:var(--header);-webkit-backdrop-filter:saturate(1.8) blur(12px);backdrop-filter:saturate(1.8) blur(12px)}}
  header.h .w{display:flex;align-items:center;gap:16px;height:56px}
  header.h .home{display:flex;align-items:center;min-height:44px;flex:none;border-radius:8px;text-decoration:none}
  header.h .logo{display:block;width:99px;height:28px;background-color:var(--ink);-webkit-mask:url(/logo-wordmark.png) left center/contain no-repeat;mask:url(/logo-wordmark.png) left center/contain no-repeat}
  header.h nav{display:flex;align-items:center;gap:2px;min-width:0;padding-left:12px;border-left:1px solid var(--line)}
  header.h nav a{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:var(--r-pill);font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;white-space:nowrap;transition:color .15s,background-color .15s}
  @media (hover:hover){header.h nav a:hover{color:var(--ink);background:var(--hover)}}
  header.h nav a[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
  .hr{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
  .hcta{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-pill);font-size:13px;font-weight:500;color:var(--ink-2);text-decoration:none;white-space:nowrap;transition:background-color .15s,color .15s}
  @media (hover:hover){.hcta:hover{background:var(--hover);color:var(--ink)}}
  .hcta svg{width:14px;height:14px;margin-left:2px}
  .ibtn{display:inline-grid;place-items:center;width:40px;height:40px;padding:0;border:0;border-radius:var(--r-pill);background:transparent;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .15s,color .15s}
  @media (hover:hover){.ibtn:hover{background:var(--hover);color:var(--ink)}}
  .ibtn svg{width:18px;height:18px}
  .tbtn .i-light,.tbtn .i-dark{display:none}
  :root[data-theme-pref="light"] .tbtn .i-sys,:root[data-theme-pref="dark"] .tbtn .i-sys{display:none}
  :root[data-theme-pref="light"] .tbtn .i-light,:root[data-theme-pref="dark"] .tbtn .i-dark{display:block}
  @media (max-width:640px){
    header.h .w{gap:8px}
    header.h .logo{width:84px;height:24px}
    header.h nav{padding-left:6px}
    header.h nav a{padding:0 10px}
    .hcta .t-long{display:none}
    .hcta{padding:0 12px}
    .ibtn{width:44px;height:44px}
  }
  @media (max-width:380px){.hcta{display:none}}

  /* page head */
  main{padding:36px 0 80px}
  @media (max-width:640px){main{padding-top:24px}}
  main.w{padding-top:36px;padding-bottom:80px}
  @media (max-width:640px){main.w{padding-top:24px}}
  .ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin:0 0 20px}
  .ph h1{font-size:30px;line-height:1.15;letter-spacing:-.025em;font-weight:700;margin:0}
  .ph .sub{margin:6px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .ph .sub a{color:var(--ink);font-weight:500}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  /* buttons: pills */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--r-pill);font-weight:600;font-size:13px;line-height:1.2;text-decoration:none;cursor:pointer;
    border:1px solid var(--line-2);background:var(--bg);color:var(--ink);box-shadow:var(--sh-sm);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;transition:background-color .15s,opacity .15s,transform .1s var(--ease-out)}
  @media (hover:hover){.btn:hover{background:var(--hover)}}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--fill);color:var(--fill-ink);border-color:var(--fill)}
  @media (hover:hover){.btn.primary:hover{background:var(--fill);opacity:.9}}
  .btn svg{width:15px;height:15px}
  @media (pointer:coarse){.btn{min-height:44px}}

  /* cards, KPI tiles */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);padding:20px;min-width:0}
  @media (max-width:640px){.card{padding:16px}}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 12px}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .kpi{padding:16px 18px}
  .kpi .label{font-size:13px;font-weight:500;color:var(--muted);line-height:1.3}
  .kpi .value{font-size:30px;line-height:1.1;font-weight:650;letter-spacing:-.025em;margin-top:8px;font-variant-numeric:tabular-nums}
  .kpi .delta{font-size:12.5px;font-weight:500;margin-top:6px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.35}
  @media (max-width:640px){.kpi{padding:14px}.kpi .value{font-size:24px}}
  .up{color:var(--ok)!important} .down{color:var(--ink-2)!important}

  /* section heads */
  .ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .ch-title{font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.35}
  .ch-sub{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
  .legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}

  /* segmented control: grey well, white active pill (never black) */
  .seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-pill);padding:3px;gap:2px;flex:none}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 12.5px/1 var(--font);padding:0 12px;min-height:30px;border-radius:var(--r-pill);cursor:pointer;white-space:nowrap;transition:color .15s,background-color .15s}
  @media (hover:hover){.seg button:hover{color:var(--ink)}}
  .seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:var(--sh-sm)}
  @media (pointer:coarse){.seg button{min-height:36px}}

  /* tables: hairline rows, right-aligned numbers, sticky header */
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;font-variant-numeric:tabular-nums}
  th{position:sticky;top:0;z-index:1;background:var(--surface);color:var(--muted);font-weight:500;font-size:12.5px;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{text-align:right;padding:10px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left;padding-left:0}
  th:last-child,td:last-child{padding-right:0}
  tr:last-child td{border-bottom:0}

  /* bar lists */
  .bars{display:flex;flex-direction:column;gap:12px}
  .bar .row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;margin-bottom:6px}
  .bar .row b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .row span{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  .bar .track{height:6px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
  .bar .fill{height:100%;border-radius:var(--r-pill);background:var(--c1)}

  /* states */
  .muted{color:var(--muted);font-size:13px}
  .note{font-size:12.5px;color:var(--muted);margin-top:20px;line-height:1.6;max-width:56rem}
  .alert{display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-2);font-size:13.5px;color:var(--ink)}
  .alert::before{content:"!";display:grid;place-items:center;flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700}
  .empty{display:grid;place-items:center;padding:28px 12px;color:var(--muted);font-size:13.5px;text-align:center}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
  .sk{display:block;border-radius:6px;background:linear-gradient(90deg,var(--sk) 30%,var(--sk-hi) 50%,var(--sk) 70%) 0 0/300% 100%;animation:sk 1.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.sk,.is-loading .kpi .value{animation:none}}
  /* /stats */
  .live{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);font-weight:500;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .live b{color:var(--ink);font-weight:600}
  .dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--live);flex:none}
  .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--live);opacity:.5;animation:ping 2s var(--ease-out) infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.5}80%,100%{transform:scale(2.6);opacity:0}}
  @media (prefers-reduced-motion:reduce){.dot::after{animation:none;opacity:0}}
  .stack > * + *{margin-top:12px}
  .grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
  .grid2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .grid2c{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 32px}
  @media (max-width:900px){.grid2,.grid2b,.grid2c{grid-template-columns:minmax(0,1fr)}}
  .sublabel{font-size:12.5px;font-weight:500;color:var(--muted);margin:0 0 10px}
  .chart{position:relative;width:100%;height:260px}
  .chart.sm{height:200px}
  @media (max-width:640px){.chart{height:220px}.chart.sm{height:180px}}
  .chart svg{display:block;width:100%;height:100%;overflow:visible}
  .chart text{font-family:var(--font);font-variant-numeric:tabular-nums}
  .is-loading .chart:empty{border-radius:var(--r-md);background:linear-gradient(90deg,var(--sk) 30%,var(--sk-hi) 50%,var(--sk) 70%) 0 0/300% 100%;animation:sk 1.4s ease-in-out infinite}
  main:not(.is-loading) .chart:empty{display:grid;place-items:center;border:1px dashed var(--line);border-radius:var(--r-md)}
  main:not(.is-loading) .chart:empty::after{content:"No data yet";font-size:13px;color:var(--muted)}
  .tip{position:absolute;z-index:2;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-md);font-size:12.5px;font-weight:600;line-height:1.45;padding:8px 10px;border-radius:var(--r-md);white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s;font-variant-numeric:tabular-nums}
  .tip span{font-weight:500;color:var(--muted);display:block;font-size:11.5px}
  .is-loading .kpi .value{color:transparent;width:62%;border-radius:6px;background:linear-gradient(90deg,var(--sk) 30%,var(--sk-hi) 50%,var(--sk) 70%) 0 0/300% 100%;animation:sk 1.4s ease-in-out infinite}
  .is-loading .kpi .delta{visibility:hidden}
  .ring{display:flex;align-items:center;gap:18px;margin:14px 0 6px}
  .ring svg{width:96px;height:96px;flex:none}
  .ring .big{font-size:28px;line-height:1;font-weight:650;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-bottom:6px}
  .ring:empty{height:96px;border-radius:var(--r-md);background:var(--surface-2)}
  .eng td:first-child{color:var(--ink-2)}
  .eng td{font-weight:500}
  .tw{overflow:auto;max-height:420px;-webkit-overflow-scrolling:touch}
  .skr td{padding:12px 0}
  @media (max-width:640px){.grid2 th{white-space:normal;vertical-align:bottom}.grid2 td,.grid2 th{padding-left:6px;padding-right:6px;font-size:13px}.grid2 td:first-child,.grid2 th:first-child{padding-left:0}}
  #buy-kinds{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  #buy-kinds:empty{display:none}
  #links-list .bars a{text-decoration:none;font-variant-numeric:tabular-nums;font-family:var(--font)}
  @media (hover:hover){#links-list .bars a:hover{text-decoration:underline}}
  #links-list .bars{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 16px!important}
  #reports-list a{text-decoration:none}
  @media (hover:hover){#reports-list a:hover{text-decoration:underline}}
  /* r6 A (item 20): table heads, bar counts and deltas: Inter 500, tabular figures, no tracking, no caps */
  th,td,.bar .row span,.kpi .delta,.ph .sub,.chart text{font-family:var(--font);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
  th,.bar .row span{font-weight:500}
  /* partner portal v2 (11 Nov 2026): photo grid, instant swaps, a Swapped tab */
  main{padding:20px 0 80px}
  .pp-top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin:0 0 14px}
  .pp-top .ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
  .pp-top h1{font-size:22px;line-height:1.2;letter-spacing:-.02em;font-weight:700;margin:0}
  .pp-top .sub{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .pp-top .right{display:flex;align-items:center;gap:10px}
  .role{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink);font-size:12px;font-weight:600}
  .pp-in{width:100%;box-sizing:border-box;min-height:42px;padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font:400 14.5px/1.4 var(--font)}
  .pp-in:focus{outline:none;border-color:var(--ring)}
  .card.login{max-width:420px;margin:48px auto 0;padding:28px;text-align:center}
  .card.login h2{margin:0 0 6px;font-size:20px;letter-spacing:-.01em}
  .card.login p{margin:0 0 18px;color:var(--muted);font-size:14px}
  .card.login form{display:flex;flex-direction:column;gap:10px}
  .card.login .pp-in{text-align:center;letter-spacing:.08em;font-size:16px;min-height:48px;border-radius:var(--r-pill)}
  .card.login .btn{min-height:46px;font-size:15px;border-radius:var(--r-pill)}
  .bar{position:sticky;top:64px;z-index:5;background:var(--bg);padding:8px 0 10px}
  .search{position:relative}
  .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
  .search input{width:100%;box-sizing:border-box;height:46px;padding:0 18px 0 44px;border:0;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink);font:400 15px/1 var(--font)}
  .search input:focus{outline:2px solid var(--ring);outline-offset:0}
  .chips{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .chip{position:relative;display:inline-flex}
  .chip select,.chip input{appearance:none;-webkit-appearance:none;height:34px;border:0;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink);font:500 13px/1 var(--font);padding:0 30px 0 14px;cursor:pointer}
  .chip input{width:86px;padding:0 12px;cursor:text}
  .chip input::placeholder{color:var(--ink);opacity:.75}
  .chip::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
  .chip.num::after{display:none}
  .chip select:focus-visible,.chip input:focus-visible{outline:2px solid var(--ring)}
  .chips .grow{flex:1}
  .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .count b{color:var(--ink);font-weight:600}
  .tabs{display:inline-flex;background:var(--surface-2);border-radius:var(--r-pill);padding:3px;gap:2px}
  .tabs button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 13px/1 var(--font);padding:8px 13px;border-radius:var(--r-pill);cursor:pointer;display:inline-flex;align-items:center;gap:6px}

  try{ const st=await (await fetch("/data/stats.json",{cache:"no-cache"})).json(); const S=st&&st.p||{}; CAT.forEach(p=>{ const v=S[p.id]; if(v) p.pop=(v[1]||0)+(v[2]||0)+0.05*(v[0]||0); }); }catch(e){}
  const c=[...new Set(CAT.map(p=>p.cat).filter(Boolean))].sort();
  $("f-cat").innerHTML='<option value="">'+esc(tr("All categories"))+'</option>'+c.map(x=>`<option>${esc(x)}</option>`).join("");
  return CAT;
}
/* the swaps: ROWS from the database; LIVE[find id] = the row that is in force (latest decision per find, if an approval) */
async function loadSwaps(){
  ROWS=await rpc("partner_list",{p_code:CODE})||[];
  const last={}; ROWS.filter(r=>r.status==="approved"||r.status==="removed").forEach(r=>{ const d=r.decided_at||r.created_at, o=last[r.pid]; if(!o||(o.decided_at||o.created_at)<d) last[r.pid]=r; });
  LIVE={}; for(const k in last) if(last[k].status==="approved") LIVE[k]=last[k];
  $("n-sw").textContent=Object.keys(LIVE).length;
}
const yuan=n=>n?"¥"+n.toLocaleString("en-US"):"";
function tile(p){
  const s=LIVE[p.id];
  return `<button type="button" class="tile${s?" is-sw":""}" data-id="${esc(p.id)}">${s?`<span class="badge">✓ ${esc(tr("Swapped"))}</span>`:""}<span class="ph"><img src="${esc(p.img)}" alt="" loading="lazy" decoding="async"></span><span class="tx"><span class="br">${esc(p.b||plName(p.pl))}</span><span class="tt">${esc(p.t)}</span><span class="mt">${esc(s?plName(s.platform)+" "+s.item_id:plName(p.pl)+" "+p.i)}</span><span class="pr">${yuan(p.price)}</span><span class="pill">${esc(tr(s?"Change":"Swap"))}</span></span></button>`;
}
function render(reset){
  if(!CAT) return; if(reset) SHOWN=60;
  const q=$("f-q").value.trim().toLowerCase().split(/\s+/).filter(Boolean), pl=$("f-pl").value, cat=$("f-cat").value,
    mn=parseFloat($("f-min").value), mx=parseFloat($("f-max").value), so=$("f-sort").value;
  const ok=p=>(!pl||p.pl===pl)&&(!cat||p.cat===cat)&&(isNaN(mn)||p.price>=mn)&&(isNaN(mx)||p.price<=mx)&&q.every(w=>p.k.includes(w));
  if(TAB==="swapped"){
    const rows=Object.values(LIVE).map(r=>({r,p:BYID[r.pid]})).filter(x=>x.p&&ok(x.p)).sort((a,b)=>(b.r.decided_at||"").localeCompare(a.r.decided_at||""));
    $("count").textContent=LANG==="zh"?rows.length+" 个已替换":rows.length+" swapped";
    $("swlist").innerHTML=rows.map(({r,p})=>`<div class="row"><img src="${esc(p.img)}" alt="" loading="lazy"><div style="min-width:0"><b>${esc(p.t)}</b><div class="sw"><a class="old" href="${esc(orig(p.pl,p.i))}" target="_blank" rel="noopener">${esc(plName(p.pl)+" "+p.i)}</a><span class="arrow">→</span><a href="${esc(orig(r.platform,r.item_id))}" target="_blank" rel="noopener">${esc(plName(r.platform)+" "+r.item_id)}</a>${r.by_name?`<span>· ${esc(r.by_name)}</span>`:""}<span>· ${esc(new Date(r.decided_at||r.created_at).toLocaleString(LANG==="zh"?"zh-CN":"en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))}</span>${r.note?`<span>· ${esc(r.note)}</span>`:""}</div></div><div class="acts"><a class="btn" href="/product/${encodeURIComponent(p.id)}" target="_blank" rel="noopener">${esc(tr("View"))}</a><button class="btn" type="button" data-undo="${r.id}">${esc(tr("Undo"))}</button></div></div>`).join("")||`<div class="empty">${esc(tr("Nothing swapped yet"))}</div>`;
    return;
  }
  LIST=CAT.filter(ok);
  if(so==="low") LIST.sort((a,b)=>a.price-b.price); else if(so==="high") LIST.sort((a,b)=>b.price-a.price); else if(so==="az") LIST.sort((a,b)=>a.t.localeCompare(b.t)); else if(so==="new") LIST.sort((a,b)=>b.n-a.n); else LIST.sort((a,b)=>b.pop-a.pop||a.n-b.n);
  $("grid").innerHTML=LIST.slice(0,SHOWN).map(tile).join("")||`<div class="empty" style="grid-column:1/-1">${esc(tr("No finds match these filters"))}</div>`;
  $("count").innerHTML=LANG==="zh"?"<b>"+LIST.length.toLocaleString("en-US")+"</b> 个商品":"<b>"+LIST.length.toLocaleString("en-US")+"</b> finds";
  $("more").hidden=LIST.length<=SHOWN;
}
/* the swap sheet */
function openSheet(id){
  const p=BYID[id]; if(!p) return; const s=LIVE[p.id];
  const ov=document.createElement("div"); ov.className="ov";
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(p.t)}" style="position:relative"><button class="ibtn x" type="button" aria-label="${esc(tr("Close"))}" data-close>✕</button>
    <div class="big"><img src="${esc(p.img)}" alt=""></div>
    <div class="body"><div><div class="br" style="font-size:12.5px;color:var(--muted)">${esc(p.b)}</div><h3>${esc(p.t)}</h3></div>
      <dl class="kv"><dt>${esc(tr("Current link"))}</dt><dd><a href="${esc(orig(p.pl,p.i))}" target="_blank" rel="noopener">${esc(plName(p.pl)+" "+p.i)}</a></dd>
      ${s?`<dt>${esc(tr("Swapped to"))}</dt><dd><a href="${esc(orig(s.platform,s.item_id))}" target="_blank" rel="noopener">${esc(plName(s.platform)+" "+s.item_id)}</a></dd>`:""}
      <dt>${esc(tr("Price"))}</dt><dd>${yuan(p.price)}</dd></dl>
      <div class="lbl">${esc(tr("Your item link"))}</div>
      <input class="pp-in" id="sh-link" type="url" placeholder="${esc(tr("Paste a Weidian, Taobao or 1688 link"))}" autocomplete="off">
      <div class="hint" id="sh-hint"></div>
      <input class="pp-in" id="sh-note" type="text" maxlength="300" placeholder="${esc(tr("Note (optional)"))}">
      <div class="go"><button class="btn primary" type="button" id="sh-go" disabled>${esc(tr("Swap"))}</button>${s?`<button class="btn" type="button" data-undo="${s.id}">${esc(tr("Undo swap"))}</button>`:""}</div>
    </div></div>`;
  document.body.appendChild(ov); requestAnimationFrame(()=>ov.classList.add("open"));
  const close=()=>{ ov.classList.remove("open"); setTimeout(()=>ov.remove(),180); document.removeEventListener("keydown",esck); };
  const esck=e=>{ if(e.key==="Escape") close(); };
  document.addEventListener("keydown",esck);
  ov.addEventListener("click",e=>{ if(e.target===ov||e.target.closest("[data-close]")) close(); });
  const inp=ov.querySelector("#sh-link"), hint=ov.querySelector("#sh-hint"), go=ov.querySelector("#sh-go");
  const check=()=>{ const r=parseLink(inp.value); if(!inp.value.trim()){ hint.textContent=""; hint.className="hint"; go.disabled=true; return null; }
    if(!r){ hint.textContent=tr("That doesn't look like a Weidian, Taobao or 1688 item link."); hint.className="hint"; go.disabled=true; return null; }
    const cur=s?[s.platform,s.item_id]:[p.pl,p.i]; if(r[0]===cur[0]&&r[1]===cur[1]){ hint.textContent=tr("That is the link the find already has."); hint.className="hint"; go.disabled=true; return null; }
    hint.textContent="✓ "+plName(r[0])+" "+r[1]; hint.className="hint ok"; go.disabled=false; return r; };
  inp.addEventListener("input",check);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!go.disabled) go.click(); });
  go.onclick=async()=>{ const r=check(); if(!r) return; go.disabled=true; err("");
    try{ await rpc("partner_submit",{p_code:CODE,p_pid:p.id,p_platform:r[0],p_item:r[1],p_note:ov.querySelector("#sh-note").value.trim()}); }
    catch(e){ hint.textContent=tr("Couldn't swap: ")+e.message; hint.className="hint"; go.disabled=false; return; }
    close(); await loadSwaps(); render(false); toast(tr("Swapped. The Buy buttons now go to your item.")); };
  setTimeout(()=>inp.focus(),60);
}
async function undo(id){
  err(""); try{ await rpc("partner_undo",{p_code:CODE,p_id:id}); }catch(e){ err(tr("Couldn't undo: ")+e.message); return; }
  document.querySelectorAll(".ov").forEach(o=>o.remove()); await loadSwaps(); render(false); toast(tr("Swap undone"));
}
async function start(code){
  err("");
  try{ CODE=(code!=null?code:(localStorage.getItem("pc.partner.code")||"")).trim().toUpperCase(); }catch(e){ CODE=(code||"").trim().toUpperCase(); }
  if(!CODE){ $("who").textContent=tr("Swap the Buy links on finds to your own shop's items."); $("signin").hidden=false; return; }
  let me; try{ me=(await rpc("partner_whoami",{p_code:CODE}))||[]; }catch(e){ err(e.message); $("signin").hidden=false; return; }
  if(!me.length){ try{ localStorage.removeItem("pc.partner.code"); }catch(e){} err(tr("That code doesn't work.")); $("signin").hidden=false; return; }
  ME=me[0]; ROLE=ME.role;
  try{ localStorage.setItem("pc.partner.code",CODE); }catch(e){}
  $("signin").hidden=true; $("out").hidden=false; $("tool").hidden=false; $("tabs").hidden=false;
  $("who").innerHTML=`<span class="role">${esc(tr(ROLE==="owner"?"Owner":"Partner"))}</span><span>${esc(ROLE==="owner"?tr("You see every swap and can undo any of them."):ME.name)}</span>`;
  try{ await Promise.all([loadCatalog(),loadSwaps()]); }catch(e){ err(e.message||tr("Couldn't load the finds. Reload the page to try again.")); }
  render(true);
}
$("codeform").addEventListener("submit",e=>{ e.preventDefault(); start($("code").value); });
$("out").onclick=()=>{ try{ localStorage.removeItem("pc.partner.code"); }catch(e){} location.reload(); };
let ft; ["f-q","f-min","f-max"].forEach(id=>$(id).addEventListener("input",()=>{ clearTimeout(ft); ft=setTimeout(()=>render(true),150); }));
["f-pl","f-cat","f-sort"].forEach(id=>$(id).addEventListener("change",()=>render(true)));
$("more").onclick=()=>{ SHOWN+=120; render(false); };
$("grid").addEventListener("click",e=>{ const t=e.target.closest(".tile"); if(t) openSheet(t.dataset.id); });
document.addEventListener("click",e=>{ const u=e.target.closest("[data-undo]"); if(u) undo(+u.dataset.undo); });
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{ TAB=b.dataset.tab; window.scrollTo({top:0});
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $("pane-all").hidden=TAB!=="all"; $("pane-swapped").hidden=TAB!=="swapped"; render(true); }));
document.documentElement.lang=LANG==="zh"?"zh-CN":"en";
$("lang").textContent=LANG==="zh"?"EN":"中文";
$("lang").onclick=()=>{ try{ localStorage.setItem("pc.partner.lang",LANG==="zh"?"en":"zh"); }catch(e){} location.reload(); };
applyLang(document.body);
try{ new MutationObserver(ms=>{ if(LANG!=="zh") return; ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1) applyLang(n); })); }).observe(document.body,{childList:true,subtree:true}); }catch(e){}
if(!LANG_SET){
  const d=document.createElement("div"); d.className="lp"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true"); d.setAttribute("aria-label","Language");
  d.innerHTML='<div class="lp-card"><h2>选择语言 · Language</h2><p>你可以随时在右上角更改。<br>You can change this later, top right.</p><button class="btn primary" type="button" data-l="zh">中文</button><button class="btn" type="button" data-l="en">English</button></div>';
  d.addEventListener("click",e=>{ const x=e.target.closest("[data-l]"); if(!x) return; try{ localStorage.setItem("pc.partner.lang",x.dataset.l); }catch(e){} if(x.dataset.l===LANG) d.remove(); else location.reload(); });
  document.body.appendChild(d);
}
start();
</script>
</body>
