<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Puro Classico — Stats</title>
<style>
  :root{ --ground:#0e1118; --card:#161b26; --line:#222a39; --ink:#eef1f6; --faint:#8a93a6; --accent:#7aa2ff; --good:#4bd08b; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;letter-spacing:.2px}
  .sub{color:var(--faint);font-size:13px;margin:2px 0 22px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px}
  .stat .n{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.5px}
  .stat .l{color:var(--faint);font-size:12.5px;margin-top:8px;text-transform:uppercase;letter-spacing:.6px}
  .stat.big{grid-column:span 2}
  @media(min-width:560px){.stat.big{grid-column:span 1}}
  .stat.hero .n{font-size:46px;color:var(--accent)}
  .row{display:flex;gap:10px;align-items:center}
  button{background:var(--accent);color:#0b0f18;border:0;border-radius:10px;padding:9px 16px;font-weight:600;font-size:13.5px;cursor:pointer}
  button.ghost{background:transparent;color:var(--faint);border:1px solid var(--line)}
  .foot{color:var(--faint);font-size:12.5px;margin-top:22px}
  .err{color:#ff8a8a;font-size:13px;margin-top:14px}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px;vertical-align:middle;animation:p 2s infinite}
  @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Puro Classico — Stats</h1>
      <div class="sub"><span class="pulse"></span><span id="updated">loading…</span></div>
    </div>
    <div class="row">
      <button id="refresh">Refresh</button>
      <button class="ghost" id="auto">Auto: ON</button>
    </div>
  </header>

  <div class="grid">
    <div class="stat hero big"><div class="n" id="s-live" style="color:var(--good)"><span class="pulse"></span>–</div><div class="l">Live viewers now</div></div>
    <div class="stat hero big"><div class="n" id="s-total">–</div><div class="l">Total users</div></div>
    <div class="stat"><div class="n" id="s-email">–</div><div class="l">With email</div></div>
    <div class="stat"><div class="n" id="s-opt">–</div><div class="l">Marketing opt-ins</div></div>
    <div class="stat"><div class="n" id="s-noemail">–</div><div class="l">No email (Discord/guest)</div></div>
    <div class="stat"><div class="n" id="s-24">–</div><div class="l">New · last 24h</div></div>
    <div class="stat"><div class="n" id="s-7">–</div><div class="l">New · last 7 days</div></div>
    <div class="stat"><div class="n" id="s-views">–</div><div class="l">Product views</div></div>
    <div class="stat big"><div class="n" id="s-latest">–</div><div class="l">Latest signup</div></div>
  </div>

  <div class="err" id="err" hidden></div>
  <div class="foot">Private page (not indexed). Numbers are live from the database. Emailable list = <b>With email</b>.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB="https://uptpghuduqjqmrxwatbm.supabase.co";
const KEY="sb_publishable_qFcO570Cpl0_VWS6e_sAUg_noD-2XmY";
/* ---- live viewers via realtime presence (same channel the site joins) ---- */
(function(){
  try{
    if(!(window.supabase&&window.supabase.createClient)) return;
    const c=window.supabase.createClient(SB,KEY);
    const ch=c.channel("online-viewers");
    function count(){
      try{
        const st=ch.presenceState()||{};
        let n=0; for(const k in st){ n+=(st[k]||[]).length; }
        document.getElementById("s-live").innerHTML='<span class="pulse"></span>'+n;
      }catch(e){}
    }
    ch.on("presence",{event:"sync"},count)
      .on("presence",{event:"join"},count)
      .on("presence",{event:"leave"},count)
      .subscribe();  // subscribe WITHOUT track() so this dashboard isn't counted
  }catch(e){}
})();
function set(id,v){ document.getElementById(id).textContent=v; }
async function load(){
  const err=document.getElementById("err"); err.hidden=true;
  try{
    // counts-only DB function (no PII exposed to the page)
    const r=await fetch(SB+"/rest/v1/rpc/site_stats",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:"{}"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json();
    set("s-total", d.total); set("s-email", d.with_email); set("s-opt", d.opted_in);
    set("s-noemail", (d.total||0)-(d.with_email||0)); set("s-24", d.last_24h); set("s-7", d.last_7d);
    set("s-views", d.views);
    set("s-latest", d.latest ? new Date(d.latest).toLocaleString() : "–");
    document.getElementById("updated").textContent="Updated "+new Date().toLocaleTimeString();
  }catch(e){
    err.hidden=false; err.textContent="Couldn't load stats: "+(e&&e.message||e);
  }
}
let auto=setInterval(load,30000);
document.getElementById("refresh").onclick=load;
document.getElementById("auto").onclick=function(){
  if(auto){ clearInterval(auto); auto=null; this.textContent="Auto: OFF"; }
  else { auto=setInterval(load,30000); this.textContent="Auto: ON"; load(); }
};
load();
</script>
</body>
</html>
